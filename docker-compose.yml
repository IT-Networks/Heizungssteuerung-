# Heizungssteuerung - Docker Compose for Unraid
#
# Setup:
# 1. Create appdata directory: mkdir -p /mnt/user/appdata/heizungssteuerung
# 2. Copy .env.example to /mnt/user/appdata/heizungssteuerung/.env
# 3. Edit .env with your credentials
# 4. Run: docker-compose up -d --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: heizungssteuerung-backend:latest
    container_name: heizung-backend
    ports:
      - "3001:3001"
    env_file:
      - /mnt/user/appdata/heizungssteuerung/.env
    environment:
      - DATA_PATH=/app/data
      - TZ=Europe/Berlin
    volumes:
      - /mnt/user/appdata/heizungssteuerung:/app/data
    restart: unless-stopped
    networks:
      - heizung-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: heizungssteuerung-frontend:latest
    container_name: heizung-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - heizung-net

networks:
  heizung-net:
    driver: bridge
