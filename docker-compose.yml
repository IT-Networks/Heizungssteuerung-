version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: heizung-backend
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - heizung-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: heizung-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - heizung-net

networks:
  heizung-net:
    driver: bridge
